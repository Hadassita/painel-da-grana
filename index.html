<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da Grana</title>
<meta name="description" content="Organize o dinheiro do mês por semana: quanto ainda dá pra gastar até domingo.">
<meta name="theme-color" content="#56653A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grana">
<style>:root{padding-top:env(safe-area-inset-top,0px);color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Cores: verde militar com dourado de moeda. Layout: app de celular numa coluna; o envelope da semana no topo, semanas do ciclo como cartões, navegação fixa embaixo */
:root{
  --bg:#EDF0E4; --surface:#FBFCF6; --ink:#1B2014; --muted:#5B634D; --line:#D3D9C2; --chip:#E1E7CF;
  --mil:#56653A; --mil-2:#67784A; --on-mil:#FFFFFF; --on-mil-muted:#D6DFBF;
  --accent:#F4C542; --accent-ink:#2A2100;
  --ok:#23784F; --ok-bg:#D9EFDF; --warn:#946000; --warn-bg:#FAEBC8; --bad:#B4382C; --bad-bg:#F7DDD8;
  --f-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10140B; --surface:#192012; --ink:#ECF0E1; --muted:#A3AC90; --line:#2B3320; --chip:#232B18;
  --mil:#4B5932; --mil-2:#5C6D3E; --on-mil:#FFFFFF; --on-mil-muted:#CDD7B1;
  --accent:#F4C542; --accent-ink:#2A2100;
  --ok:#58C48C; --ok-bg:#16301F; --warn:#E9AE4A; --warn-bg:#3A2C0E; --bad:#F07A6E; --bad-bg:#3D1C18;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10140B; --surface:#192012; --ink:#ECF0E1; --muted:#A3AC90; --line:#2B3320; --chip:#232B18;
  --mil:#4B5932; --mil-2:#5C6D3E; --on-mil:#FFFFFF; --on-mil-muted:#CDD7B1;
  --accent:#F4C542; --accent-ink:#2A2100;
  --ok:#58C48C; --ok-bg:#16301F; --warn:#E9AE4A; --warn-bg:#3A2C0E; --bad:#F07A6E; --bad-bg:#3D1C18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800}
h2{font-size:17px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .cycle{font-size:13px;color:var(--muted);text-align:right}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner b{color:var(--ink)}

/* envelope */
.env{position:relative;background:var(--mil);color:var(--on-mil);border-radius:22px;padding:30px 20px 20px;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.env::before{content:"";position:absolute;inset:0 0 auto 0;height:58px;background:var(--mil-2);clip-path:polygon(0 0,100% 0,50% 100%)}
.env > *{position:relative}
.env .label{color:var(--on-mil-muted)}
.env .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.env .big.over{color:#FFB3A8}
.env .sub{color:var(--on-mil-muted);font-size:14px}
.env .sub b{color:var(--on-mil);font-weight:600}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over > i{background:var(--bad)}
.env .rows{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--on-mil-muted);flex-wrap:wrap}
.env .rows b{color:var(--on-mil)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--chip);color:var(--muted)}
.pill.gold{background:var(--accent);color:var(--accent-ink)}

.guide{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.guide span{flex:0 0 auto;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--on-mil-muted)}
.guide span b{display:block;color:var(--on-mil);font-size:14px}
.guide span.today{background:var(--accent);color:var(--accent-ink)}
.guide span.today b{color:var(--accent-ink)}

.section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

/* semanas */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.wk.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.wk .d{font-size:13px;font-weight:600}
.wk .v{font-size:13px;color:var(--muted)}
.wk .v b{color:var(--ink);font-weight:600}

/* dia da semana */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;padding-top:6px}
.dow .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.dow .col i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--chip);min-height:3px}
.dow .col.hl i{background:var(--accent)}
.dow .col small{font-size:11px;color:var(--muted);white-space:nowrap}
.dow .col span{font-size:12px;font-weight:600}

/* terceiros */
.tp{display:flex;flex-direction:column;gap:12px}
.tp-row{display:flex;flex-direction:column;gap:6px}
.tp-row .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.tp-bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.tp-bar i{display:block;height:100%;background:var(--mil-2)}
.tp-bar.over i{background:var(--bad)}

.split{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.split div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split div b{font-size:15px}

/* formulário */
form{display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:20px}
.money input{padding-left:50px;font-family:var(--f-display);font-size:26px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--mil);border-color:var(--mil);color:var(--on-mil)}
.hint{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:600}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.quick > .btn{flex:1 1 150px}
.fixlist{display:flex;flex-direction:column;gap:2px;padding:6px}
.fixo{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:10px;border-radius:10px;text-align:left}
.fixo:hover{background:var(--chip)}
.fixo .n{flex:1;min-width:0}
.fixo .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 22px}
.fixo.ok .ck{background:var(--mil);border-color:var(--mil);color:var(--on-mil)}
.fixo.ok .n{color:var(--muted);text-decoration:line-through}
.fx{display:grid;grid-template-columns:1fr 128px auto;gap:8px;align-items:center}
.fx .money input{font-size:17px;padding-left:40px}
.fx .money span{font-size:15px}
.fx-list{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.err{color:var(--bad);font-size:13px}

/* histórico */
.nav-c{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-c button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:18px}
.nav-c button:disabled{opacity:.35;cursor:default}
.day{display:flex;flex-direction:column;gap:6px}
.day h3{font-size:13px;font-family:var(--f-body);font-weight:600;color:var(--muted);text-transform:capitalize}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .t{flex:1;min-width:0}
.item .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:12px}
.item .val{font-weight:600}
.item .val.in{color:var(--ok)}
.item .del{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px}
.item .del.confirm{background:var(--bad-bg);color:var(--bad);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.dot.proprio{background:var(--accent)} .dot.cartao{background:var(--mil-2)} .dot.terceiros{background:var(--muted)} .dot.entrada{background:var(--ok)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--chip)}
.tabs button.add{color:var(--accent-ink)}
.tabs button.add .ic{background:var(--accent);border-radius:10px;width:36px;height:28px;display:grid;place-items:center}
.tabs button.add .ic svg{width:20px;height:20px}
.tabs button.add[aria-current="page"]{background:transparent}

/* boas-vindas */
.how{display:flex;flex-direction:column;gap:10px;counter-reset:passo}
.how li{list-style:none;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.how li::before{counter-increment:passo;content:counter(passo);display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--mil);color:var(--on-mil);font-family:var(--f-display);font-weight:800;font-size:17px}
.how b{display:block;margin-bottom:2px}
.how p{margin:0;font-size:14px;color:var(--muted)}
.how ul{margin:0;padding:0}
.preview{background:var(--mil);color:var(--on-mil);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.preview .label{color:var(--on-mil-muted)}
.preview .big{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1}
.preview .calc{font-size:13px;color:var(--on-mil-muted);display:flex;flex-direction:column;gap:2px}
.preview .calc span{display:flex;justify-content:space-between;gap:8px}
.preview .calc b{color:var(--on-mil);font-weight:600}
.intro{margin:0;color:var(--muted);font-size:15px}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:10px}
.priv{font-size:13px;color:var(--muted);background:var(--chip);border-radius:12px;padding:12px 14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.env .big{font-size:38px}}
</style>
</head>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Seções">
  <div class="tabs-in">
    <button data-tab="semana" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Semana</button>
    <button data-tab="registrar" class="add" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Registrar</button>
    <button data-tab="historico" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Histórico</button>
    <button data-tab="ajustes" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
  </div>
</nav>

<script>
(function(){
"use strict";
const KEY = "painel-da-grana-v1";
const DIAS = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const ORIGENS = {proprio:"Meu dinheiro", cartao:"Meu cartão", terceiros:"De outra pessoa"};
const fmtBRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl = v => fmtBRL.format(Math.round((v+Number.EPSILON)*100)/100);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

/* ---------- datas (sempre AAAA-MM-DD, horário local) ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = (y,m,d) => { const dt=new Date(y,m-1,d); return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()); };
const toDate = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => { const t=new Date(); return iso(t.getFullYear(),t.getMonth()+1,t.getDate()); };
const addDays = (s,n) => { const d=toDate(s); d.setDate(d.getDate()+n); return iso(d.getFullYear(),d.getMonth()+1,d.getDate()); };
const daysIncl = (a,b) => Math.round((toDate(b)-toDate(a))/864e5)+1;
const dow = s => (toDate(s).getDay()+6)%7; // 0 = segunda
const ddmm = s => s.slice(8,10)+"/"+s.slice(5,7);
const longDay = s => toDate(s).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"});

function cycleOf(s, dia){
  const [y,m,d]=s.split("-").map(Number);
  let sy=y, sm=m;
  if(d<dia){ sm--; if(sm<1){ sm=12; sy--; } }
  const start = iso(sy,sm,dia);
  let ny=sy, nm=sm+1; if(nm>12){ nm=1; ny++; }
  const end = addDays(iso(ny,nm,dia),-1);
  return {start,end};
}
function weeksOf(c){
  const out=[]; let cur=c.start;
  while(cur<=c.end){
    const wEnd = addDays(cur, 6-dow(cur));
    const fim = wEnd < c.end ? wEnd : c.end;
    out.push({ini:cur, fim, dias:daysIncl(cur,fim)});
    cur = addDays(fim,1);
  }
  return out;
}

/* ---------- estado ---------- */
let memOnly = false;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); if(s && s.config){ if(s.config.margem==null) s.config.margem = s.exemplo?100:0; delete s.config.margemPct; s.fixos=s.fixos||[]; s.pagos=s.pagos||{}; return s; } } }
  catch(e){ memOnly = true; }
  return exampleState();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); memOnly=false; }
  catch(e){ memOnly = true; }
}
function freshState(){
  return {config:{diaInicio:5, guardar:0, margem:0}, tetos:{}, fixos:[], pagos:{}, entradas:[], gastos:[], exemplo:false};
}
function exampleState(){
  const st = freshState(); st.exemplo = true; st.config.guardar = 300; st.config.margem = 100;
  st.tetos = {"Pai":300};
  st.fixos = [{id:"fx1", nome:"Academia", valor:89.9},{id:"fx2", nome:"Plano do celular", valor:45}];
  const t = today();
  // 1 número pseudoaleatório fixo, para o exemplo não mudar a cada abertura
  let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
  const c1 = cycleOf(t,5), c0 = cycleOf(addDays(c1.start,-1),5);
  for(const c of [c0,c1]){
    st.entradas.push({id:uid(), data:c.start, valor:1080, desc:"Bolsa"});
    st.entradas.push({id:uid(), data:addDays(c.start,1) <= t || c===c0 ? addDays(c.start,1) : c.start, valor:350, desc:"Ajuda da mãe"});
  }
  const peso=[0.55,0.45,0.6,0.9,1.5,1.7,1.0];
  const lista=["Lanche na universidade","Almoço no RU","Café","Mercadinho","Lanche com amigos","Açaí","Xerox","Cinema","Sorvete","Padaria"];
  let d = c0.start;
  while(d<=t){
    const w=dow(d);
    if(rnd() < 0.78){
      const v = Math.round((8 + rnd()*30*peso[w])*100)/100;
      st.gastos.push({id:uid(), data:d, valor:v, desc:lista[Math.floor(rnd()*lista.length)], origem:"proprio"});
    }
    if(w>=4 && rnd()<0.5) st.gastos.push({id:uid(), data:d, valor:Math.round((20+rnd()*35)*100)/100, desc:"Saída com a turma", origem: rnd()<0.5?"cartao":"proprio"});
    if(rnd()<0.22) st.gastos.push({id:uid(), data:d, valor:Math.round((12+rnd()*14)*100)/100, desc:"Uber", origem:"terceiros", dono:"Pai"});
    if(w>=4 && rnd()<0.25) st.gastos.push({id:uid(), data:d, valor:Math.round((35+rnd()*25)*100)/100, desc:"iFood", origem:"terceiros", dono:"Pai"});
    d=addDays(d,1);
  }
  st.pagos = {[c1.start]:["fx1"]};
  return st;
}
let state = load();
let tab = "semana";
let histCycleOffset = 0;
let formTipo = "gasto";
let formOrigem = "proprio";
let formModo = "um";
function inicioSemana(){ const t=today(), seg=addDays(t,-dow(t)), c=cycleOf(t,state.config.diaInicio); return seg<c.start?c.start:seg; }
let toastTimer = null;
let deferredPrompt = null;
const isStandalone = () => { try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }catch(e){ return false; } };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; if(tab==="ajustes") render(); });
window.addEventListener("appinstalled",()=>{ deferredPrompt=null; render(); });

/* ---------- cálculos ---------- */
const contaNoEnvelope = g => g.origem==="proprio" || g.origem==="cartao";
// um total de vários dias é dividido igualmente entre os dias do período
function pecas(g){
  if(!g.ini || g.ini>=g.data) return [g];
  const n=daysIncl(g.ini,g.data), out=[]; let d=g.ini;
  for(let i=0;i<n;i++){ out.push({...g, data:d, valor:g.valor/n}); d=addDays(d,1); }
  return out;
}
const gastosDia = () => state.gastos.flatMap(pecas);
function sum(arr, f){ return arr.reduce((a,x)=>a+f(x),0); }

function pattern(){
  const t=today();
  const gs = gastosDia().filter(g=>contaNoEnvelope(g) && g.data<=t);
  const tot=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  if(!gs.length) return {avg:[1,1,1,1,1,1,1], enough:false, empty:true, span:0};
  let first = gs.reduce((a,g)=>g.data<a?g.data:a, t);
  for(const g of gs) tot[dow(g.data)] += g.valor;
  let d=first; while(d<=t){ cnt[dow(d)]++; d=addDays(d,1); }
  const avg = tot.map((v,i)=> cnt[i]? v/cnt[i] : 0);
  const span = daysIncl(first,t);
  return {avg, enough: span>=14, empty:false, span};
}

function compute(refDate){
  const cfg=state.config, t=today();
  const c = cycleOf(refDate, cfg.diaInicio);
  const inC = x => x.data>=c.start && x.data<=c.end;
  const entradas = state.entradas.filter(inC);
  const gastos = gastosDia().filter(inC);
  const totalEnt = sum(entradas, e=>e.valor);
  const totalFixos = sum(state.fixos||[], f=>f.valor);
  const base = Math.max(0, totalEnt - (cfg.guardar||0) - totalFixos);
  const margem = Math.min(base, cfg.margem||0);
  const dist = base - margem;
  const totalDias = daysIncl(c.start,c.end);
  const weeks = weeksOf(c).map(w=>{
    const gw = gastos.filter(g=>contaNoEnvelope(g) && g.data>=w.ini && g.data<=w.fim);
    return {...w, env: dist*w.dias/totalDias, gasto: sum(gw,g=>g.valor)};
  });
  let curIdx = weeks.findIndex(w=>t>=w.ini && t<=w.fim);
  let carry=0;
  weeks.forEach((w,i)=>{ w.carryIn = carry; if(curIdx===-1 || i<=curIdx){ carry += w.env - w.gasto; } w.saldo = w.carryIn + w.env - w.gasto; });
  const proprio = sum(gastos.filter(g=>g.origem==="proprio"),g=>g.valor);
  const cartao = sum(gastos.filter(g=>g.origem==="cartao"),g=>g.valor);
  const terc = {};
  gastos.filter(g=>g.origem==="terceiros").forEach(g=>{ const k=(g.dono||"Sem nome").trim()||"Sem nome"; terc[k]=(terc[k]||0)+g.valor; });
  Object.keys(state.tetos||{}).forEach(k=>{ if(!(k in terc)) terc[k]=0; });
  return {c, entradas, gastos, totalEnt, totalFixos, base, margem, dist, weeks, curIdx, proprio, cartao, terc};
}

function renderSemana(){
  const t=today(), r=compute(t), pat=pattern();
  let html = header() + storageWarn() + exampleBanner();

  if(!r.entradas.length){
    html += `<div class="card section"><h2>Comece registrando o que entrou</h2><p class="muted small" style="margin:0">Bolsa, mesada, salário, Pix da família. O painel separa uma parte desse valor para cada semana, de segunda a domingo, a partir do dia ${state.config.diaInicio}.</p><div><button class="btn" type="button" data-act="nova-entrada">Registrar entrada</button></div></div>`;
  }

  const w = r.weeks[r.curIdx];
  if(w){
    const disp = w.carryIn + w.env;
    const rest = disp - w.gasto;
    const pct = disp>0 ? Math.min(100, w.gasto/disp*100) : (w.gasto>0?100:0);
    const over = rest < -0.005;
    const carryTxt = Math.abs(w.carryIn)<0.005 ? "" : w.carryIn>0 ? ` · inclui <b>${brl(w.carryIn)}</b> que sobrou` : ` · já desconta <b>${brl(-w.carryIn)}</b> que passou`;
    // guia por dia, pelo padrão real
    const restDays=[]; let d=t; while(d<=w.fim){ restDays.push(d); d=addDays(d,1); }
    const wts = restDays.map(x=> pat.enough ? Math.max(pat.avg[dow(x)], 0.01) : 1);
    const wsum = wts.reduce((a,b)=>a+b,0);
    const guide = restDays.map((x,i)=>({d:x, v: Math.max(0,rest)*wts[i]/wsum}));
    html += `<section class="env" aria-label="Dinheiro da semana">
      <div class="label">Dinheiro da semana · ${ddmm(w.ini)} a ${ddmm(w.fim)}</div>
      <div><div class="big num ${over?"over":""}">${over? "−"+brl(-rest) : brl(rest)}</div>
      <div class="sub">${over ? "passou do dinheiro da semana. A diferença sai da semana que vem." : `ainda dá pra gastar até ${w.fim===r.c.end && dow(w.fim)!==6 ? "o fim do ciclo" : "domingo"}`}</div></div>
      <div class="bar ${over?"over":""}"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="rows num"><span>Gasto <b>${brl(w.gasto)}</b> de <b>${brl(disp)}</b></span><span>Da semana <b>${brl(w.env)}</b>${carryTxt}</span></div>
      ${!over && rest>0.005 ? `<div><div class="label" style="margin-bottom:6px">Sugestão por dia${pat.enough?", pelo seu jeito de gastar":""}</div><div class="guide num">${guide.map((g,i)=>`<span class="${i===0?"today":""}">${i===0?"Hoje":DIAS[dow(g.d)]}<b>${brl(g.v)}</b></span>`).join("")}</div></div>` : ""}
    </section>`;
  } else if(r.entradas.length){
    html += `<div class="card muted">Hoje está fora do ciclo atual.</div>`;
  }

  if(r.entradas.length){
    html += `<div class="row quick"><button type="button" class="btn" data-act="novo-gasto">+ Registrar gasto</button><button type="button" class="btn ghost" data-act="total-semana">Lançar o total da semana</button></div>`;
  }
  if(r.totalEnt>0){
    html += `<section class="section"><div class="sec-head"><h2>Este ciclo</h2><span class="small muted num">entrou ${brl(r.totalEnt)}</span></div>
      <div class="split num">
        <div><span class="label">Para as semanas</span><b>${brl(r.dist)}</b></div>
        <div><span class="label">Guardar</span><b>${brl(state.config.guardar||0)}</b></div>
        <div><span class="label">Reserva</span><b>${brl(r.margem)}</b></div>
        <div><span class="label">Gastos fixos</span><b>${brl(r.totalFixos)}</b></div>
      </div>
      <div class="weeks num">${r.weeks.map((x,i)=>{
        let st;
        if(r.curIdx===-1 || i>r.curIdx) st = `<span class="pill neutral">A seguir</span>`;
        else if(i===r.curIdx) st = `<span class="pill gold">Esta semana</span>`;
        else { const s = x.env - x.gasto; st = s>=-0.005 ? `<span class="pill ok">Sobrou ${brl(s)}</span>` : `<span class="pill bad">Passou ${brl(-s)}</span>`; }
        return `<div class="wk ${i===r.curIdx?"cur":""}"><div class="d">${ddmm(x.ini)} a ${ddmm(x.fim)}</div><div class="v">Para gastar <b>${brl(x.env)}</b></div>${i<=r.curIdx||r.curIdx===-1&&x.gasto>0?`<div class="v">Gasto <b>${brl(x.gasto)}</b></div>`:""}<div>${st}</div></div>`;
      }).join("")}</div>
      <p class="hint" style="margin:0">Gastos no seu dinheiro: ${brl(r.proprio)} · no seu cartão: ${brl(r.cartao)}. Os dois saem do dinheiro da semana, porque a fatura do seu cartão é paga com o seu dinheiro.</p>
    </section>`;
  }

  // gastos fixos: checklist do ciclo
  if((state.fixos||[]).length){
    const pagos=(state.pagos||{})[r.c.start]||[], np=state.fixos.filter(f=>pagos.includes(f.id)).length;
    html += `<section class="section"><div class="sec-head"><h2>Gastos fixos</h2><span class="small muted num">${np} de ${state.fixos.length} pagos</span></div>
      <div class="card fixlist">${state.fixos.map(f=>{ const ok=pagos.includes(f.id); return `<button type="button" class="fixo ${ok?"ok":""}" data-pago="${f.id}" aria-pressed="${ok}"><span class="ck" aria-hidden="true">${ok?"✓":""}</span><span class="n">${esc(f.nome)}</span><b class="num">${brl(f.valor)}</b></button>`; }).join("")}</div>
      <p class="hint" style="margin:0">Já foram descontados antes de dividir pelas semanas. Toque para marcar quando pagar: isso não mexe no dinheiro da semana.</p></section>`;
  }
  // terceiros
  const tk = Object.keys(r.terc);
  if(tk.length){
    html += `<section class="section"><div class="sec-head"><h2>Pago por outras pessoas</h2><span class="small muted">não sai do seu dinheiro</span></div><div class="card tp num">${tk.map(k=>{
      const v=r.terc[k], teto=(state.tetos||{})[k];
      if(teto){ const p=Math.min(100,v/teto*100), ov=v>teto;
        return `<div class="tp-row"><div class="h"><span>${esc(k)}</span><span><b>${brl(v)}</b> <span class="muted">de ${brl(teto)}</span></span></div><div class="tp-bar ${ov?"over":""}"><i style="width:${p.toFixed(1)}%"></i></div>${ov?`<span class="small" style="color:var(--bad)">Passou ${brl(v-teto)} do combinado</span>`:""}</div>`; }
      return `<div class="tp-row"><div class="h"><span>${esc(k)}</span><b>${brl(v)}</b></div><span class="hint">Sem limite combinado. Dá pra definir em Ajustes.</span></div>`;
    }).join("")}</div></section>`;
  }

  // padrão por dia da semana
  if(!pat.empty){
    const max = Math.max(...pat.avg, 0.01), td=dow(t);
    html += `<section class="section"><div class="sec-head"><h2>Seu gasto por dia da semana</h2><span class="small muted">média por dia</span></div>
      <div class="card"><div class="dow num" role="img" aria-label="Média de gasto por dia da semana">${pat.avg.map((v,i)=>`<div class="col ${i===td?"hl":""}"><span>${v>=0.5?Math.round(v):"0"}</span><i style="height:${(v/max*100*0.78).toFixed(1)}%"></i><small>${DIAS[i]}</small></div>`).join("")}</div>
      <p class="hint" style="margin:10px 0 0">${pat.enough ? `Baseado em ${pat.span} dias de registros, contando só seu dinheiro e seu cartão. A sugestão por dia segue esse padrão e se ajusta sozinha.` : `Com ${pat.span} ${pat.span===1?"dia":"dias"} de registros ainda é cedo. A partir de 14 dias, a sugestão por dia passa a seguir esse padrão.`}</p></div></section>`;
  }
  if(!isStandalone()) html += `<button type="button" class="btn ghost" data-act="ir-instalar">Instalar no celular</button>`;
  return html;
}

function renderHistorico(){
  const base = cycleOf(today(), state.config.diaInicio);
  let ref = base.start; for(let i=0;i<histCycleOffset;i++){ ref = cycleOf(addDays(ref,-1), state.config.diaInicio).start; }
  const c = cycleOf(ref, state.config.diaInicio);
  const items = state.gastos.map(g=>({...g,tipo:"gasto"})).concat(state.entradas.map(e=>({...e,tipo:"entrada"})))
    .filter(x=>x.data>=c.start && x.data<=c.end).sort((a,b)=> a.data<b.data?1:a.data>b.data?-1:0);
  const anyOlder = state.gastos.concat(state.entradas).some(x=>x.data<c.start);
  const byDay = {}; items.forEach(x=>{ (byDay[x.data]=byDay[x.data]||[]).push(x); });
  let html = header("Histórico") + `<div class="nav-c"><button type="button" data-act="hist-prev" aria-label="Ciclo anterior" ${anyOlder?"":"disabled"}>‹</button><strong class="num">${ddmm(c.start)} a ${ddmm(c.end)}</strong><button type="button" data-act="hist-next" aria-label="Próximo ciclo" ${histCycleOffset>0?"":"disabled"}>›</button></div>`;
  if(!items.length) return html + `<div class="empty">Nada registrado neste ciclo.</div>`;
  html += `<div class="row small muted"><span class="row" style="gap:6px"><i class="dot proprio"></i>Meu dinheiro</span><span class="row" style="gap:6px"><i class="dot cartao"></i>Meu cartão</span><span class="row" style="gap:6px"><i class="dot terceiros"></i>De outra pessoa</span><span class="row" style="gap:6px"><i class="dot entrada"></i>Entrada</span></div>`;
  html += Object.keys(byDay).map(d=>`<div class="day"><h3>${longDay(d)}</h3>${byDay[d].map(x=>{
    const sub = x.tipo==="entrada" ? "Entrada" : (x.origem==="terceiros" ? `Pago por ${esc(x.dono||"outra pessoa")}` : ORIGENS[x.origem]) + (x.ini && x.ini<x.data ? ` · total de ${ddmm(x.ini)} a ${ddmm(x.data)}` : "");
    return `<div class="item"><i class="dot ${x.tipo==="entrada"?"entrada":x.origem}"></i><div class="t"><div>${esc(x.desc||"Sem descrição")}</div><small>${sub}</small></div><span class="val num ${x.tipo==="entrada"?"in":""}">${x.tipo==="entrada"?"+":""}${brl(x.valor)}</span><button type="button" class="del" data-del="${x.tipo}:${x.id}" aria-label="Apagar ${esc(x.desc)}">Apagar</button></div>`;
  }).join("")}</div>`).join("");
  return html;
}

    ${(state.fixos||[]).map(f=>`<div class="row" style="justify-content:space-between"><span>${esc(f.nome)}: <b class="num">${brl(f.valor)}</b></span><button type="button" class="btn ghost sm" data-fixo-del="${f.id}">Remover</button></div>`).join("")}
    <form id="fixo" class="row" novalidate style="gap:8px;flex-direction:row;align-items:flex-end">
      <div class="field" style="flex:1 1 120px"><label for="fx-nome">Conta</label><input id="fx-nome" type="text" placeholder="Ex.: aluguel"></div>
      <div class="field" style="flex:1 1 110px"><label for="fx-valor">Valor por ciclo</label><input id="fx-valor" type="text" inputmode="decimal" placeholder="500,00"></div>
      <button class="btn ghost" type="submit">Adicionar</button>
    </form>
  </div>
  <div class="card section">
    <h2>Limites combinados</h2>
    <p class="hint" style="margin:0">Para o que outra pessoa paga por você, como o cartão dos pais. É o teto por ciclo que vocês combinaram.</p>
    ${tetos.length?tetos.map(([k,v])=>`<div class="row" style="justify-content:space-between"><span>${esc(k)}: <b class="num">${brl(v)}</b></span><button type="button" class="btn ghost sm" data-teto-del="${esc(k)}">Remover</button></div>`).join(""):""}
    <form id="teto" class="row" novalidate style="gap:8px;flex-direction:row;align-items:flex-end">
      <div class="field" style="flex:1 1 120px"><label for="t-nome">Quem paga</label><input id="t-nome" type="text" placeholder="Ex.: Pai"></div>
      <div class="field" style="flex:1 1 110px"><label for="t-valor">Limite</label><input id="t-valor" type="text" inputmode="decimal" placeholder="300,00"></div>
      <button class="btn ghost" type="submit">Adicionar</button>
    </form>
  </div>
  ${installCard()}
  <div class="priv">Seus dados ficam só neste navegador, neste aparelho. Ninguém mais vê o que você registra. Se limpar os dados do navegador ou trocar de celular, use o backup abaixo para não perder nada.</div>
  <details>
    <summary>Backup</summary>
    <div class="section">
      <p class="hint" style="margin:0">Copie o texto e guarde num lugar seguro, como uma nota só sua. Para restaurar, cole aqui ou escolha o arquivo.</p>
      <textarea id="bk" aria-label="Texto do backup" spellcheck="false"></textarea>
      <div class="row"><button type="button" class="btn ghost sm" data-act="bk-gerar">Gerar backup</button><button type="button" class="btn ghost sm" data-act="bk-copiar">Copiar</button><button type="button" class="btn sm" data-act="bk-restaurar">Restaurar o texto colado</button></div>
      <div class="field"><label for="bk-file">Ou restaurar de um arquivo</label><input id="bk-file" type="file" accept=".json,.txt,application/json,text/plain"></div>
    </div>
  </details>
  <div class="card section">
    <h2>Apagar tudo</h2>
    <p class="hint" style="margin:0">Remove todos os registros e ajustes deste navegador. Não dá para desfazer sem backup.</p>
    <div class="row"><button type="button" class="btn danger" data-act="apagar1">Apagar tudo</button><button type="button" class="btn danger" data-act="apagar2" hidden>Confirmar: apagar tudo</button></div>
  </div>
  <div class="row"><button type="button" class="btn ghost" data-act="como">Como funciona o método</button>${state.exemplo?"":`<button type="button" class="btn ghost" data-act="ver-exemplo">Ver o exemplo de novo</button>`}</div>`;
}

function renderInicio(){
  const cfg=state.config, t=today();
  const c=cycleOf(t,cfg.diaInicio);
  const temEntrada = state.entradas.some(e=>e.data>=c.start && e.data<=c.end) && !state.exemplo;
  let html = header("Como funciona") + `
  <p class="intro">Você divide o que entra no mês entre as semanas. Assim, todo dia dá pra ver quanto ainda pode gastar até domingo, sem fazer conta.</p>
  <ol class="how" style="margin:0;padding:0">
    <li><div><b>O dinheiro entra e começa o seu ciclo</b><p>Bolsa, mesada, salário. O ciclo vai do dia em que o dinheiro cai até a véspera desse dia no mês seguinte, e não do dia 1 ao 30.</p></div></li>
    <li><div><b>Uma parte fica de fora</b><p>Logo de cara saem os gastos fixos (aluguel, academia, assinaturas), o que você quer guardar e uma reserva para imprevistos, como farmácia ou um conserto.</p></div></li>
    <li><div><b>O resto vira o dinheiro de cada semana</b><p>É como separar em envelopes, um para cada semana, de segunda a domingo. Você só precisa olhar para o da semana atual.</p></div></li>
    <li><div><b>O que sobra passa para a semana seguinte</b><p>Sobrou? Soma na próxima. Passou? A diferença sai da próxima. Nada se perde no caminho.</p></div></li>
    <li><div><b>O que outra pessoa paga fica à parte</b><p>Se alguém paga coisas por você, no cartão dela ou com um dinheiro que manda só para isso, você registra separado, com um limite combinado se quiser.</p></div></li>
  </ol>`;
  if(temEntrada){
    return html + `<button type="button" class="btn" data-tab-go="semana">Voltar para o painel</button>`;
  }
  return html + `
  <form id="ob" class="card" novalidate>
    <h2>Monte o seu ciclo</h2>
    <div class="field"><label for="o-dia">Em que dia o dinheiro costuma entrar?</label><select id="o-dia">${Array.from({length:28},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===cfg.diaInicio?"selected":""}>Dia ${n}</option>`).join("")}</select><span class="hint">O ciclo é o seu mês do dinheiro: começa no dia em que o dinheiro cai e vai até a véspera desse dia no mês seguinte. Exemplo: se cai no dia 5, o ciclo vai de 5/11 a 4/12. Se o dinheiro vem de mais de um lugar, escolha o dia do valor principal.</span></div>
    <div class="field"><label for="o-valor">Quanto entra neste ciclo, somando tudo?</label><div class="money"><span>R$</span><input id="o-valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"></div></div>
    <div class="field"><label for="o-desc">De onde vem?</label><input id="o-desc" type="text" placeholder="Ex.: bolsa e mesada" autocomplete="off"></div>
    <div class="field"><label for="o-guardar">Quanto você quer guardar por ciclo?</label><div class="money"><span>R$</span><input id="o-guardar" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"></div><span class="hint">É o que você separa para juntar, como uma poupança ou um porquinho. Esse valor não entra nas semanas. Pode ser zero.</span></div>
    <div class="field"><label for="o-margem">Quanto deixar de reserva para imprevistos?</label><div class="money"><span>R$</span><input id="o-margem" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"></div><span class="hint">Reserva é um dinheiro separado que você só usa se acontecer algo fora do plano, como remédio, conserto ou uma passagem de última hora. Também não entra nas semanas. Pode ser zero.</span></div>
    <div class="field"><label>Você tem gastos fixos?</label><span class="hint">Contas que se repetem todo ciclo com valor parecido e saem do seu dinheiro: aluguel, internet, academia, assinaturas. Elas são descontadas antes de dividir pelas semanas, então pagar o aluguel não estoura a semana. Se outra pessoa paga a conta, não coloque aqui.</span><div id="o-fixos" class="fx-list"></div><div><button type="button" class="btn ghost sm" data-act="o-add-fixo">+ Adicionar gasto fixo</button></div></div>
    <div class="preview num" id="o-prev" aria-live="polite"></div>
    <div id="o-err" class="err" hidden></div>
    <button class="btn" type="submit">Começar</button>
    <button class="btn ghost" type="button" data-tab-go="semana">Pular por enquanto</button>
  </form>`;
}
let fxSeq=0;
function linhaFixo(){ fxSeq++; return `<div class="fx"><input type="text" id="o-fx-n${fxSeq}" class="fx-nome" placeholder="Ex.: academia" aria-label="Nome do gasto fixo" autocomplete="off"><div class="money"><span>R$</span><input type="text" id="o-fx-v${fxSeq}" class="fx-valor" inputmode="decimal" placeholder="0,00" aria-label="Valor do gasto fixo" autocomplete="off"></div><button type="button" class="btn ghost sm" data-act="o-del-fixo">Remover</button></div>`; }
function lerFixosOb(){ return [...document.querySelectorAll("#o-fixos .fx")].map(row=>({nome:row.querySelector(".fx-nome").value.trim(), valor:parseMoney(row.querySelector(".fx-valor").value)||0})).filter(f=>f.valor>0); }
function updatePreview(){
  const el=document.getElementById("o-prev"); if(!el) return;
  const dia=Number(document.getElementById("o-dia").value)||5;
  const v=parseMoney(document.getElementById("o-valor").value)||0;
  const g=parseMoney(document.getElementById("o-guardar").value)||0;
  const m=parseMoney(document.getElementById("o-margem").value)||0;
  const fx=lerFixosOb().reduce((a,f)=>a+f.valor,0);
  const c=cycleOf(today(),dia), dias=daysIncl(c.start,c.end);
  const sem=Math.max(0,v-g-m-fx), porSemana=sem*7/dias;
  if(!(v>0)){ el.innerHTML=`<span class="label">Seu dinheiro por semana</span><div class="calc">Digite quanto entra para ver o cálculo.</div>`; return; }
  el.innerHTML=`<span class="label">Seu dinheiro por semana</span><div class="big">${brl(porSemana)}</div>
    <div class="calc"><span>Entra no ciclo <b>${brl(v)}</b></span><span>Gastos fixos <b>− ${brl(fx)}</b></span><span>Guardar <b>− ${brl(g)}</b></span><span>Reserva para imprevistos <b>− ${brl(m)}</b></span><span>Fica para as semanas <b>${brl(sem)}</b></span><span>Ciclo de ${ddmm(c.start)} a ${ddmm(c.end)}, ${dias} dias <b>${(dias/7).toFixed(1).replace(".",",")} semanas</b></span></div>
    ${g+m+fx>v?`<div class="small" style="color:var(--accent)">Gastos fixos, guardar e reserva somados passam do que entra. Diminua algum deles.</div>`:""}`;
}

function render(){
  const map = {inicio:renderInicio, semana:renderSemana, registrar:renderRegistrar, historico:renderHistorico, ajustes:renderAjustes};
  app.innerHTML = map[tab]();
  if(tab==="inicio") updatePreview();
  document.querySelectorAll(".tabs button").forEach(b=> b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
}
function go(t){ tab=t; render(); window.scrollTo(0,0); }
function toast(msg){
  let el=document.querySelector(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;},2200);
}
function parseMoney(s){
  s=String(s||"").trim().replace(/\s|R\$/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  const v=Number(s); return isFinite(v)?Math.round(v*100)/100:NaN;
}
function leaveExample(){ if(state.exemplo){ state = freshState(); } }

/* ---------- eventos ---------- */
document.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(b) go(b.dataset.tab); });

app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tabGo){ go(b.dataset.tabGo); return; }
  if(b.dataset.tipo){ formTipo=b.dataset.tipo; render(); return; }
  if(b.dataset.origem || b.dataset.modo){
    const keep={}; ["f-valor","f-desc","f-dono"].forEach(id=>{ const el=document.getElementById(id); if(el) keep[id]=el.value; });
    if(b.dataset.origem) formOrigem=b.dataset.origem; else formModo=b.dataset.modo;
    render(); Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
    return;
  }
  if(b.dataset.del){
    if(!b.classList.contains("confirm")){ b.classList.add("confirm"); b.textContent="Confirmar"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("confirm"); b.textContent="Apagar"; } },3000); return; }
    const [tp,id]=b.dataset.del.split(":"); const arr = tp==="entrada"?state.entradas:state.gastos;
    const i=arr.findIndex(x=>x.id===id); if(i>-1) arr.splice(i,1); save(); render(); toast("Registro apagado"); return;
  }
  if(b.dataset.pago){
    const k=cycleOf(today(),state.config.diaInicio).start; state.pagos=state.pagos||{}; const arr=state.pagos[k]=state.pagos[k]||[];
    const i=arr.indexOf(b.dataset.pago); if(i>-1) arr.splice(i,1); else arr.push(b.dataset.pago);
    save(); render(); return;
  }
  if(b.dataset.fixoDel){ state.fixos=(state.fixos||[]).filter(f=>f.id!==b.dataset.fixoDel); save(); render(); toast("Gasto fixo removido"); return; }
  if(b.dataset.tetoDel!=null){ delete state.tetos[b.dataset.tetoDel]; save(); render(); toast("Limite removido"); return; }
  const a=b.dataset.act;
  if(a==="zerar"){ state=freshState(); save(); go("inicio"); }
  else if(a==="como"){ go("inicio"); }
  else if(a==="ver-exemplo"){ state=exampleState(); save(); go("semana"); }
  else if(a==="o-add-fixo"){ const box=document.getElementById("o-fixos"); box.insertAdjacentHTML("beforeend", linhaFixo()); box.lastElementChild.querySelector(".fx-nome").focus(); }
  else if(a==="o-del-fixo"){ b.closest(".fx").remove(); updatePreview(); }
  else if(a==="ir-instalar"){ go("ajustes"); const el=document.getElementById("instalar"); if(el) el.scrollIntoView(); }
  else if(a==="instalar" && deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; render(); }); }
  else if(a==="novo-gasto"){ formTipo="gasto"; formModo="um"; go("registrar"); }
  else if(a==="total-semana"){ formTipo="gasto"; formModo="total"; go("registrar"); }
  else if(a==="nova-entrada"){ formTipo="entrada"; go("registrar"); }
  else if(a==="hist-prev"){ histCycleOffset++; render(); }
  else if(a==="hist-next"){ histCycleOffset=Math.max(0,histCycleOffset-1); render(); }
  else if(a==="bk-gerar"){ document.getElementById("bk").value=JSON.stringify(state); toast("Backup gerado"); }
  else if(a==="bk-copiar"){
    const ta=document.getElementById("bk"); if(!ta.value) ta.value=JSON.stringify(state);
    const fallback=()=>{ ta.focus(); ta.select(); toast("Texto selecionado. Copie com o menu do aparelho."); };
    try{ navigator.clipboard.writeText(ta.value).then(()=>toast("Backup copiado"),fallback); }catch(err){ fallback(); }
  }
  else if(a==="bk-restaurar"){ restore(document.getElementById("bk").value); }
  else if(a==="apagar1"){ b.hidden=true; document.querySelector('[data-act="apagar2"]').hidden=false; }
  else if(a==="apagar2"){ state=freshState(); save(); go("inicio"); toast("Tudo apagado"); }
});

function restore(txt){
  try{
    const s=JSON.parse(txt);
    if(!s || !s.config || !Array.isArray(s.gastos) || !Array.isArray(s.entradas)) throw new Error();
    s.tetos=s.tetos||{}; s.fixos=s.fixos||[]; s.pagos=s.pagos||{}; s.exemplo=false; state=s; save(); go("semana"); toast("Backup restaurado");
  }catch(err){ toast("Esse texto não é um backup do Painel da Grana"); }
}
app.addEventListener("input",e=>{ if(e.target.closest("#ob")) updatePreview(); });
app.addEventListener("change",e=>{
  if(e.target.id==="o-dia") updatePreview();
  if(e.target.id==="bk-file" && e.target.files[0]){ const r=new FileReader(); r.onload=()=>restore(String(r.result)); r.readAsText(e.target.files[0]); }
});

app.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="f"){
    const err=document.getElementById("f-err");
    const valor=parseMoney(document.getElementById("f-valor").value);
    const desc=document.getElementById("f-desc").value.trim();
    let data=document.getElementById("f-data").value || today();
    let ini = formTipo==="gasto" && formModo==="total" ? (document.getElementById("f-ini").value||data) : "";
    if(ini && ini>data){ const x=ini; ini=data; data=x; }
    if(!(valor>0)){ err.textContent="Digite um valor maior que zero, por exemplo 12,50."; err.hidden=false; document.getElementById("f-valor").focus(); return; }
    let dono="";
    if(formTipo==="gasto" && formOrigem==="terceiros"){ dono=document.getElementById("f-dono").value.trim(); if(!dono){ err.textContent="Diga quem pagou, por exemplo Pai."; err.hidden=false; document.getElementById("f-dono").focus(); return; } }
    leaveExample();
    if(formTipo==="gasto") state.gastos.push({id:uid(), data, valor, desc, origem:formOrigem, ...(dono?{dono}:{}), ...(ini&&ini<data?{ini}:{})});
    else state.entradas.push({id:uid(), data, valor, desc});
    save();
    const msg = formTipo==="gasto" ? `Gasto de ${brl(valor)} registrado` : `Entrada de ${brl(valor)} registrada`;
    formTipo="gasto"; formModo="um"; go("semana"); toast(msg);
  }
  else if(f.id==="ob"){
    const err=document.getElementById("o-err");
    const dia=Number(document.getElementById("o-dia").value)||5;
    const v=parseMoney(document.getElementById("o-valor").value);
    const g=parseMoney(document.getElementById("o-guardar").value)||0;
    const m=parseMoney(document.getElementById("o-margem").value)||0;
    if(!(v>0)){ err.textContent="Digite quanto entra neste ciclo, por exemplo 1.200,00."; err.hidden=false; document.getElementById("o-valor").focus(); return; }
    const fixos=lerFixosOb();
    if(g+m+fixos.reduce((a,f)=>a+f.valor,0)>v){ err.textContent="Gastos fixos, guardar e reserva somados não podem passar do que entra."; err.hidden=false; return; }
    leaveExample();
    state.config.diaInicio=dia; state.config.guardar=g; state.config.margem=m;
    state.fixos=fixos.map((f,i)=>({id:uid(), nome:f.nome||`Gasto fixo ${i+1}`, valor:f.valor}));
    state.entradas.push({id:uid(), data:cycleOf(today(),dia).start, valor:v, desc:document.getElementById("o-desc").value.trim()||"Entrada do ciclo"});
    save(); go("semana"); toast("Ciclo montado. Agora é só registrar os gastos.");
  }
  else if(f.id==="cfg"){
    const g=parseMoney(document.getElementById("c-guardar").value);
    const m=parseMoney(document.getElementById("c-margem").value);
    state.config.diaInicio=Number(document.getElementById("c-dia").value)||5;
    state.config.guardar= g>=0 ? g : 0;
    state.config.margem= m>=0 ? m : 0;
    save(); render(); toast("Ajustes salvos");
  }
  else if(f.id==="fixo"){
    const n=document.getElementById("fx-nome").value.trim(), v=parseMoney(document.getElementById("fx-valor").value);
    if(!n || !(v>0)){ toast("Preencha o nome da conta e o valor"); return; }
    leaveExample(); state.fixos=state.fixos||[]; state.fixos.push({id:uid(), nome:n, valor:v}); save(); render(); toast("Gasto fixo adicionado");
  }
  else if(f.id==="teto"){
    const n=document.getElementById("t-nome").value.trim(), v=parseMoney(document.getElementById("t-valor").value);
    if(!n || !(v>0)){ toast("Preencha de quem é e o valor do limite"); return; }
    state.tetos=state.tetos||{}; state.tetos[n]=v; save(); render(); toast("Limite salvo");
  }
});

if(!state.exemplo && !state.entradas.length && !state.gastos.length) tab="inicio";
save();
render();
try{ if("serviceWorker" in navigator && window.self===window.top && location.protocol==="https:") navigator.serviceWorker.register("./sw.js").catch(()=>{}); }catch(e){}
window.__grana = {compute, cycleOf, weeksOf, pattern, get state(){return state;}};
})();
</script>

</body>
</html>
